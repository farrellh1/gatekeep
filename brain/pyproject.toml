[project]
name = "gatekeep-brain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2",
  "langchain-openai>=1.2",
  "langchain-core>=1.4",
  "pydantic>=2.13",
  "pyyaml>=6.0",
  "python-dotenv>=1.2",
  "fastapi>=0.136",
  "uvicorn[standard]>=0.48",
  "tree-sitter>=0.25.2",
  "tree-sitter-language-pack>=1.8.1",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-mock>=3.15", "httpx>=0.28", "ruff>=0.15.15", "pre-commit>=4.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Fixtures are deliberately-broken sample repos (hallucinated symbols, no-op diffs)
# used as check inputs -- they must not be held to lint standards.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, SIM simplify.
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert-heavy, fixture-driven style; bugbear's B011/B017 add noise.
"tests/**" = ["B011", "B017"]
