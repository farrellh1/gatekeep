[project]
name = "gatekeep-brain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2",
  "langchain-openai>=1.2",
  "langchain-core>=1.4",
  "pydantic>=2.13",
  "pyyaml>=6.0",
  "python-dotenv>=1.2",
  "fastapi>=0.136",
  "uvicorn[standard]>=0.48",
  "tree-sitter>=0.25.2",
  "tree-sitter-language-pack>=1.8.1",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-mock>=3.15", "httpx>=0.28"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*"]
