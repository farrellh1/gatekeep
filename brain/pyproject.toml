[project]
name = "gatekeep-brain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "langchain-openai>=1.0",
  "langchain-core>=1.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3.14"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*"]
