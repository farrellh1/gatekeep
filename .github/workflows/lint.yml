name: lint

# Enforces formatting + lint on both services so style stays consistent
# across contributors. Logic/tests live in their own suites; this gate is
# purely about style drift.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  brain:
    name: brain (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.8"
      - run: ruff check .
      - run: ruff format --check .

  gateway:
    name: gateway (eslint + prettier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
